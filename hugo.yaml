# Site configuration — David A. Reiss personal pages
# Theme: PaperMod v8.0 (git submodule, themes/PaperMod)
# Deployment: GitHub Pages via GitHub Actions (.github/workflows/hugo.yaml)

baseURL: "https://d-a-reiss.github.io/"
locale: "en-us"
defaultContentLanguage: "en"
title: "David A. Reiss"
theme: "PaperMod"

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false

# NOTE: declaring taxonomies REPLACES Hugo's defaults — keep all three.
taxonomies:
  topic: topics
  tag: tags
  category: categories

# Which sections appear on the home page list (writings + research).
mainSections: ["writings", "research"]

# Image processing cache dir (used by the CI workflow).
caches:
  images:
    dir: :cacheDir/images

markup:
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: false
    style: monokai
  goldmark:
    renderer:
      unsafe: true

# Search index (index.json) is required for the /search/ page.
outputs:
  home:
    - HTML
    - RSS
    - JSON

menus:
  main:
    - name: About
      url: /about/
      weight: 1
    - name: CV
      url: /cv/
      weight: 2
    - name: Writings
      url: /writings/
      weight: 3
    - name: Projects
      url: /projects/
      weight: 4
    - name: Publications
      url: /publications/
      weight: 5
    - name: Talks
      url: /talks/
      weight: 6
    - name: Topics
      url: /topics/
      weight: 7
    - name: Tags
      url: /tags/
      weight: 8
    - name: Archive
      url: /archives/
      weight: 9
    - name: Search
      url: /search/
      weight: 10

params:
  author: "David A. Reiss"
  description: "Personal pages of David A. Reiss"

  # Legal links, rendered site-wide in the footer by the theme
  footer:
    text: "[Impressum](/impressum/) · [Datenschutz](/datenschutz/)"

  # Home-Info mode (intro block + selected publications on the homepage).
  homeInfoParams:
    title: "David A. Reiss"
    content: >
      Software Consultant @ TNG Technology Consulting | AI Researcher | Theoretical Physicist

  socialIcons:
    - name: github
      url: "https://github.com/D-A-Reiss"
    - name: linkedin
      url: "https://de.linkedin.com/in/david-a-reiss-9582292a7"
    - name: googlescholar
      title: "Google Scholar"
      url: "https://scholar.google.com/citations?user=3A12dgkAAAAJ"

  # Academic layout overrides (layouts/home.html, layouts/_default/publications.html):
  # only publication entries with `selected: true` appear on the homepage.
  ShowOnlySelectedPubs: true

  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowToc: true
  ShowAllPagesInArchive: true
  ShowRssButtonInSectionTermList: true
