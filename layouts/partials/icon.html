{{- /* Site overlay of the academics fork's icon mechanism: renders
       assets/icons/<name>.svg inline, tinted with the current text color. */}}
<span class="inline-svg" >
{{- $fname := print "assets/icons/" . ".svg" -}}
{{- $path:="<path" -}}
{{- $fill:="<path fill=\"currentColor\"" -}}
{{ replace (readFile $fname) $path $fill | safeHTML }}
</span>
